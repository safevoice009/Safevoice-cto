version: '3.9'

services:
  safevoice-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_WALLETCONNECT_PROJECT_ID: ${VITE_WALLETCONNECT_PROJECT_ID:-}
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
        PUBLIC_URL: ${PUBLIC_URL:-/}
    image: safevoice:latest
    container_name: safevoice-app
    ports:
      - "${PORT:-8080}:80"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      com.safevoice.service: "frontend"
      com.safevoice.version: "1.0.0"
    networks:
      - safevoice-network

networks:
  safevoice-network:
    driver: bridge
    name: safevoice-network
