apiVersion: v1
kind: Service
metadata:
  name: safevoice-frontend
  namespace: safevoice
  labels:
    app.kubernetes.io/name: safevoice
    app.kubernetes.io/component: frontend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: safevoice
    app.kubernetes.io/component: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  sessionAffinity: None
