apiVersion: v1
kind: Secret
metadata:
  name: safevoice-secrets
  namespace: safevoice
  labels:
    app.kubernetes.io/name: safevoice
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # IMPORTANT: Replace these placeholders with actual values
  # For production, use sealed-secrets or external secret management (e.g., Vault, AWS Secrets Manager)
  
  # WalletConnect Project ID (required)
  VITE_WALLETCONNECT_PROJECT_ID: "YOUR_WALLETCONNECT_PROJECT_ID"
  
  # Supabase Configuration (optional)
  VITE_SUPABASE_URL: ""
  VITE_SUPABASE_ANON_KEY: ""
  
  # HuggingFace API Token (optional)
  VITE_HF_API_TOKEN: ""
  
  # Deployer Private Key (for contract deployment)
  DEPLOYER_PRIVATE_KEY: ""
  
  # Block Explorer API Keys
  ETHERSCAN_API_KEY: ""
  POLYGONSCAN_API_KEY: ""
  BSCSCAN_API_KEY: ""
  OPTIMISM_API_KEY: ""
  ARBISCAN_API_KEY: ""
  BASESCAN_API_KEY: ""
